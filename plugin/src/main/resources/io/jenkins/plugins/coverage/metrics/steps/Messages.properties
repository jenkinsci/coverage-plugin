HelpModel.displayName=Help
HelpModel.group.percentage=Percentage
HelpModel.group.absolute=Absolute
HelpModel.tendency.larger=Larger is better
HelpModel.tendency.smaller=Smaller is better
HelpModel.elements.methods=Methods
HelpModel.elements.classes=Classes
HelpModel.elements.files=Files

HelpModel.baseline.PROJECT=All files of the project.
HelpModel.baseline.PROJECT_DELTA=Difference between the values of the whole project and the values of the \
  whole project of the reference build.
HelpModel.baseline.MODIFIED_LINES=Only the code lines that have been modified with respect to the reference build, \
  e.g., the changes of a pull or merge request.
HelpModel.baseline.MODIFIED_LINES_DELTA=Difference between the values of the modified code lines and the values of \
  the modified files.
HelpModel.baseline.MODIFIED_FILES=All lines of the files that contain modifications with respect to the reference \
  build.
HelpModel.baseline.MODIFIED_FILES_DELTA=Difference between the values of the modified files and the values of the \
  same files in the reference build.
HelpModel.baseline.INDIRECT=Code lines whose coverage has changed without being modified, e.g., since tests have \
  been added or removed.

HelpModel.aggregation.OVERALL=The value of the metric for the whole selection, e.g., the line coverage of all \
  lines, the sum of the cyclomatic complexity of all methods, or the mean value of percentages like the class \
  cohesion. The overall value is computed as shown in the column "Overall value" of the metrics table.
HelpModel.aggregation.MAXIMUM=The largest value of all elements that provide the metric, e.g., the method with \
  the highest cyclomatic complexity or the file with the best line coverage.
HelpModel.aggregation.MINIMUM=The smallest value of all elements that provide the metric, e.g., the file with the \
  worst line coverage or the class with the lowest cohesion.

HelpModel.computation.CONTAINER=Covered and missed elements of this type
HelpModel.computation.SUM=Sum of all values
HelpModel.computation.MEAN=Mean of the values of all classes
HelpModel.computation.LINES_OF_CODE=Total number of lines of the line coverage, otherwise the sum of all values

HelpModel.metric.CONTAINER=Covered and missed container elements (e.g., directories).
HelpModel.metric.MODULE=Covered and missed modules: a module is covered if at least one of its elements is covered.
HelpModel.metric.PACKAGE=Covered and missed packages, namespaces, or directories.
HelpModel.metric.FILE=Covered and missed files: a file is covered if at least one of its lines is covered.
HelpModel.metric.CLASS=Covered and missed classes.
HelpModel.metric.METHOD=Covered and missed methods or functions.
HelpModel.metric.LINE=Percentage of the code lines that have been executed by the tests.
HelpModel.metric.BRANCH=Percentage of the branches (or decisions) that have been executed by the tests.
HelpModel.metric.INSTRUCTION=Percentage of the byte code instructions that have been executed by the tests.
HelpModel.metric.MCDC_PAIR=Percentage of the condition pairs that independently affect a decision \
  (modified condition and decision coverage).
HelpModel.metric.FUNCTION_CALL=Percentage of the function calls that have been executed by the tests.
HelpModel.metric.STMT_DC=Combined statement and decision coverage.
HelpModel.metric.STMT_CC=Combined statement and condition coverage.
HelpModel.metric.CONDITION=Percentage of the boolean conditions that have been evaluated to both true and false.
HelpModel.metric.BYTES=Percentage of the object code bytes that have been executed by the tests.
HelpModel.metric.MUTATION=Percentage of the mutations that have been detected (killed) by the tests.
HelpModel.metric.TEST_STRENGTH=Percentage of the mutations in covered code that have been detected by the tests.
HelpModel.metric.TESTS=Number of tests.
HelpModel.metric.TEST_SUCCESS_RATE=Percentage of the tests that have passed.
HelpModel.metric.LOC=Number of lines of code.
HelpModel.metric.NCSS=Number of statements, without blank lines and comments (non-commenting source statements).
HelpModel.metric.CYCLOMATIC_COMPLEXITY=Number of independent paths through a method (McCabe complexity).
HelpModel.metric.COGNITIVE_COMPLEXITY=Effort to understand the control flow of a method.
HelpModel.metric.NPATH_COMPLEXITY=Number of acyclic execution paths through a method.
HelpModel.metric.ACCESS_TO_FOREIGN_DATA=Number of attributes of other classes that are accessed directly or via \
  accessors.
HelpModel.metric.COHESION=Percentage of method pairs of a class that use common attributes (tight class cohesion).
HelpModel.metric.FAN_OUT=Number of other classes that are referenced.
HelpModel.metric.NUMBER_OF_ACCESSORS=Number of getter and setter methods of a class.
HelpModel.metric.WEIGHT_OF_CLASS=Percentage of the public methods of a class that provide functionality rather \
  than access to attributes.
HelpModel.metric.WEIGHED_METHOD_COUNT=Sum of the cyclomatic complexity of all methods of a class.
HelpModel.metric.WARNINGS=Number of warnings reported by static analysis tools.
HelpModel.metric.BUGS=Number of bugs reported by static analysis tools.
HelpModel.metric.ERRORS=Number of errors reported by static analysis tools.
HelpModel.metric.DUPLICATIONS=Number of duplicated code fragments.
HelpModel.metric.VULNERABILITIES=Number of security vulnerabilities.
HelpModel.metric.AUTHORS=Number of different authors that changed the code.
HelpModel.metric.COMMITS=Number of commits that changed the code.
HelpModel.metric.CODE_CHURN=Number of added and deleted lines over time.
