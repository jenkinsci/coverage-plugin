metrics-tooltip=Percentage: metrics with values between 0% and 100% (e.g., line coverage or class cohesion). \
  Absolute: metrics with absolute values (e.g., lines of code or cyclomatic complexity). \
  Both groups are shown in separate charts, since their values cannot share the same Y-axis.
