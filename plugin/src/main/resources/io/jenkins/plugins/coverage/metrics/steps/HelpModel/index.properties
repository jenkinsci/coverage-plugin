baselines-intro=A baseline defines which part of the project is evaluated. The delta baselines show the difference \
  to another baseline or to the reference build, the reference build is selected when the results are recorded.
aggregations-intro=An aggregation defines how the values of all elements of a baseline are combined into a single \
  value. The aggregation can be selected in quality gates and in several views (Treemap, Scatter Plot, and Trend).
aggregations-details=The maximum and minimum are selected from the elements that provide the metric, see the last \
  column of the metrics table. If a report provides the values of a metric on a coarser level only (e.g., the \
  complexity of files rather than of methods), then these values are used instead. Container metrics provide only an \
  overall value. Builds that have been recorded with an older version of the plugin provide overall values only.
metrics-intro=The following metrics are part of this report. Percentages and absolute values are shown in separate \
  charts, since they cannot share the same axis. The tendency defines whether larger or smaller values are better, \
  it is used to color the values and their differences.
